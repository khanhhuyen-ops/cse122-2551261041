<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BỐN MÙA</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poem {
            box-sizing: border-box;
            width: 640px;
            padding: 24px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            text-align: center;
        }

        .poem h1 {
            margin: 0 0 20px;
            padding: 6px 0;
            color: #D40000;
            background-color: #FFD9E6;
            font-size: 26px;
            font-weight: bold;
        }

        .poem p {
            margin: 0;
            color: #0033CC;
            font-style: italic;
            line-height: 1.7;
        }

        .poem .red {
            color: #D40000;
        }

        .poem hr {
            width: 55%;
            margin: 20px auto;
            border: 0;
            border-top: 1px solid #0033CC;
        }
    </style>
</head>
<body>
    <main class="poem">
        <h1>BỐN MÙA</h1>

        <p>
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="red">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p>
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </main>
</body>
</html>
